name: Build portfolio

on:
  push:
    branches: [main, feature/dotnet-portfolio]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/Portfolio/Portfolio.csproj
      - name: Build
        run: dotnet build src/Portfolio/Portfolio.csproj --configuration Release --no-restore
